<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamCraft AI - Trợ lý tạo đề thi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0d9488', // Teal 600
              primaryDark: '#0f766e', // Teal 700
              secondary: '#475569', // Slate 600
              accent: '#2dd4bf', // Teal 400
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }

      /* === TEAL GRADIENT BACKGROUND === */
      .bg-app-gradient {
        background: linear-gradient(135deg, #e6f7f5 0%, #f0fdfa 40%, #ecfdf5 70%, #f0fdfa 100%);
        position: relative;
      }
      .bg-app-gradient::before {
        content: '';
        position: fixed;
        top: -50%;
        right: -30%;
        width: 80%;
        height: 80%;
        background: radial-gradient(circle, rgba(13,148,136,0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      /* === ELEVATED CARDS (Nổi khối) === */
      .card-elevated {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(8px);
        border-radius: 16px;
        border: 1px solid rgba(13,148,136,0.1);
        box-shadow:
          0 4px 6px -1px rgba(13,148,136,0.07),
          0 10px 25px -5px rgba(13,148,136,0.1),
          0 20px 50px -12px rgba(0,0,0,0.06);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-elevated:hover {
        transform: translateY(-2px);
        box-shadow:
          0 8px 12px -2px rgba(13,148,136,0.1),
          0 16px 35px -8px rgba(13,148,136,0.15),
          0 28px 60px -15px rgba(0,0,0,0.08);
      }

      /* === GLASSMORPHISM HEADER === */
      .glass-header {
        background: linear-gradient(135deg, rgba(240,253,250,0.95), rgba(204,251,241,0.85));
        backdrop-filter: blur(16px) saturate(1.6);
        -webkit-backdrop-filter: blur(16px) saturate(1.6);
        border-bottom: 1px solid rgba(13,148,136,0.15);
        box-shadow: 0 4px 20px -4px rgba(13,148,136,0.12);
      }

      /* === FLOATING STEP BAR === */
      .step-bar-floating {
        background: rgba(255,255,255,0.94);
        backdrop-filter: blur(12px);
        border-radius: 14px;
        margin: 12px 24px;
        box-shadow:
          0 4px 12px -2px rgba(13,148,136,0.08),
          0 8px 24px -4px rgba(0,0,0,0.06);
        border: 1px solid rgba(13,148,136,0.08);
        padding: 14px 24px;
      }

      /* Active step glow */
      .step-active-glow {
        box-shadow: 0 0 0 3px rgba(13,148,136,0.2), 0 2px 8px rgba(13,148,136,0.3);
      }

      /* === GRADIENT BUTTONS === */
      .btn-gradient-primary {
        background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        box-shadow: 0 4px 14px -3px rgba(13,148,136,0.5);
        transition: all 0.25s ease;
      }
      .btn-gradient-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px -3px rgba(13,148,136,0.6);
        background: linear-gradient(135deg, #0f9d91 0%, #0d9488 100%);
      }

      /* === ENHANCED MODAL === */
      .modal-elevated {
        background: white;
        border-radius: 20px;
        box-shadow:
          0 20px 60px -12px rgba(0,0,0,0.2),
          0 40px 80px -20px rgba(13,148,136,0.15);
        border: 1px solid rgba(13,148,136,0.1);
      }

      /* === UPLOAD AREA === */
      .upload-zone {
        border: 2px dashed rgba(13,148,136,0.3);
        background: linear-gradient(135deg, rgba(240,253,250,0.5), rgba(204,251,241,0.3));
        border-radius: 14px;
        transition: all 0.3s ease;
      }
      .upload-zone:hover {
        border-color: rgba(13,148,136,0.5);
        background: linear-gradient(135deg, rgba(240,253,250,0.8), rgba(204,251,241,0.5));
        transform: translateY(-1px);
      }

      /* === INPUT FIELDS === */
      .input-elevated {
        border: 1px solid rgba(13,148,136,0.15);
        border-radius: 10px;
        box-shadow: 0 2px 6px -2px rgba(13,148,136,0.06);
        transition: all 0.25s ease;
        background: white;
      }
      .input-elevated:focus {
        border-color: #0d9488;
        box-shadow: 0 0 0 3px rgba(13,148,136,0.1), 0 2px 8px -2px rgba(13,148,136,0.12);
      }

      /* === SECTION BADGE (Number circles) === */
      .badge-section {
        background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        box-shadow: 0 2px 8px -2px rgba(13,148,136,0.4);
      }

      /* === SHORTCUT BOX === */
      .shortcut-box {
        background: linear-gradient(135deg, rgba(219,234,254,0.6), rgba(191,219,254,0.4));
        border: 1px solid rgba(59,130,246,0.2);
        border-radius: 16px;
        box-shadow: 0 4px 16px -4px rgba(59,130,246,0.1);
      }

      /* === ANIMATIONS === */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      /* === PROGRESS BAR GRADIENT === */
      .progress-gradient {
        background: linear-gradient(90deg, #0d9488, #2dd4bf, #10b981);
        border-radius: 4px;
      }

      /* === TOPIC TREE === */
      .chapter-row {
        transition: all 0.2s ease;
      }
      .chapter-row:hover {
        background: rgba(240,253,250,0.6) !important;
      }

      /* === Custom scrollbar === */
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(240,253,250,0.5);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #99f6e4, #5eead4);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #5eead4, #2dd4bf);
      }

      /* === EDITOR/PREVIEW PANELS === */
      .panel-elevated {
        background: white;
        border-radius: 14px;
        border: 1px solid rgba(13,148,136,0.1);
        box-shadow:
          0 4px 12px -2px rgba(13,148,136,0.06),
          0 8px 24px -4px rgba(0,0,0,0.04);
        overflow: hidden;
      }

      /* === QUESTION CONFIG TABLE === */
      .config-table {
        background: linear-gradient(135deg, rgba(248,250,252,0.8), rgba(240,253,250,0.4));
        border-radius: 14px;
        border: 1px solid rgba(13,148,136,0.1);
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        padding: 16px;
      }

      /* === INFO CHIP/BADGE === */
      .chip-teal {
        background: linear-gradient(135deg, #ccfbf1, #d1fae5);
        border: 1px solid rgba(13,148,136,0.15);
        border-radius: 8px;
        box-shadow: 0 1px 3px rgba(13,148,136,0.06);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-black h-screen">

</html>
