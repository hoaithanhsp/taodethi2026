  <text x="55.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="21" font-style="italic">y'</text>
  <text x="55.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="21" font-style="italic">y</text>

