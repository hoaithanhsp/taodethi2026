  <text x="136" y="212" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="21">∞</text>
  <text x="250" y="132" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">2</text>
  <text x="380" y="212" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">−2</text>
  <text x="493" y="132" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">+</text>
  <text x="506" y="132" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="21">∞</text>

