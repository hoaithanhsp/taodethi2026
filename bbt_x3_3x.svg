  <text x="506" y="41.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="21">∞</text>

  <!-- Hàng y' -->
  <text x="190.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">+</text>
  <text x="250" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">0</text>
  <text x="315.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">−</text>
  <text x="380" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">0</text>
  <text x="440.0" y="83.0" text-anchor="middle" dominant-baseline="central" font-family="Times New Roman, serif" font-size="20">+</text>

