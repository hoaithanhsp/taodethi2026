<head>
  <meta charset="UTF-8" />

  <title>Tạo Đề Thi Theo CV 7991</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0d9488', // Teal 600
            primaryDark: '#0f766e', // Teal 700
            secondary: '#475569', // Slate 600
            accent: '#2dd4bf', // Teal 400
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* === TEAL GRADIENT BACKGROUND === */
    .bg-app-gradient {
      background: linear-gradient(135deg, #e6f7f5 0%, #f0fdfa 40%, #ecfdf5 70%, #f0fdfa 100%);
      position: relative;
    }

    .bg-app-gradient::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* === ELEVATED CARDS (Nổi khối 3D) === */
    .card-elevated {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 3px solid rgba(13, 148, 136, 0.18);
      box-shadow:
        0 1px 2px rgba(13, 148, 136, 0.06),
        0 4px 8px -1px rgba(13, 148, 136, 0.1),
        0 12px 28px -4px rgba(13, 148, 136, 0.14),
        0 24px 56px -10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-elevated:hover {
      transform: translateY(-3px) scale(1.003);
      border-bottom-color: rgba(13, 148, 136, 0.25);
      box-shadow:
        0 2px 4px rgba(13, 148, 136, 0.08),
        0 8px 16px -2px rgba(13, 148, 136, 0.14),
        0 20px 40px -6px rgba(13, 148, 136, 0.18),
        0 36px 72px -16px rgba(0, 0, 0, 0.12);
    }

    /* === GLASSMORPHISM HEADER === */
    .glass-header {
      background: linear-gradient(135deg, rgba(230, 247, 245, 0.97), rgba(204, 251, 241, 0.90), rgba(167, 243, 208, 0.8));
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-bottom: 2px solid rgba(13, 148, 136, 0.15);
      box-shadow:
        0 4px 16px -2px rgba(13, 148, 136, 0.12),
        0 8px 30px -4px rgba(0, 0, 0, 0.06);
    }

    /* === FLOATING STEP BAR === */
    .step-bar-floating {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      margin: 12px 24px;
      box-shadow:
        0 2px 6px rgba(13, 148, 136, 0.06),
        0 6px 16px -2px rgba(13, 148, 136, 0.1),
        0 14px 32px -6px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(13, 148, 136, 0.1);
      border-bottom: 2px solid rgba(13, 148, 136, 0.12);
      padding: 16px 28px;
    }

    /* Active step glow */
    .step-active-glow {
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2), 0 2px 8px rgba(13, 148, 136, 0.3);
    }

    /* === GRADIENT BUTTONS === */
    .btn-gradient-primary {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 4px 14px -3px rgba(13, 148, 136, 0.5);
      transition: all 0.25s ease;
    }

    .btn-gradient-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px -3px rgba(13, 148, 136, 0.6);
      background: linear-gradient(135deg, #0f9d91 0%, #0d9488 100%);
    }

    /* === ENHANCED MODAL === */
    .modal-elevated {
      background: white;
      border-radius: 20px;
      box-shadow:
        0 20px 60px -12px rgba(0, 0, 0, 0.2),
        0 40px 80px -20px rgba(13, 148, 136, 0.15);
      border: 1px solid rgba(13, 148, 136, 0.1);
    }

    /* === UPLOAD AREA === */
    .upload-zone {
      border: 2px dashed rgba(13, 148, 136, 0.3);
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.5), rgba(204, 251, 241, 0.3));
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .upload-zone:hover {
      border-color: rgba(13, 148, 136, 0.5);
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.8), rgba(204, 251, 241, 0.5));
      transform: translateY(-1px);
    }

    /* === INPUT FIELDS === */
    .input-elevated {
      border: 1px solid rgba(13, 148, 136, 0.15);
      border-radius: 10px;
      box-shadow: 0 2px 6px -2px rgba(13, 148, 136, 0.06);
      transition: all 0.25s ease;
      background: white;
    }

    .input-elevated:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1), 0 2px 8px -2px rgba(13, 148, 136, 0.12);
    }

    /* === SECTION BADGE (Number circles) === */
    .badge-section {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 3px 10px -2px rgba(13, 148, 136, 0.5);
    }

    /* === SHORTCUT BOX === */
    .shortcut-box {
      background: linear-gradient(135deg, rgba(219, 234, 254, 0.6), rgba(191, 219, 254, 0.4));
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      box-shadow: 0 4px 16px -4px rgba(59, 130, 246, 0.1);
    }

    /* === ANIMATIONS === */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* === PROGRESS BAR GRADIENT === */
    .progress-gradient {
      background: linear-gradient(90deg, #0d9488, #2dd4bf, #10b981);
      border-radius: 4px;
    }

    /* === TOPIC TREE === */
    .chapter-row {
      transition: all 0.2s ease;
    }

    .chapter-row:hover {
      background: rgba(240, 253, 250, 0.6) !important;
    }

    /* === Custom scrollbar === */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(240, 253, 250, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #99f6e4, #5eead4);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #5eead4, #2dd4bf);
    }

    /* === EDITOR/PREVIEW PANELS === */
    .panel-elevated {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 3px solid rgba(13, 148, 136, 0.15);
      box-shadow:
        0 2px 6px rgba(13, 148, 136, 0.06),
        0 8px 20px -4px rgba(13, 148, 136, 0.1),
        0 16px 40px -8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    /* === QUESTION CONFIG TABLE === */
    .config-table {
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.6), rgba(204, 251, 241, 0.25));
      border-radius: 14px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 2px solid rgba(13, 148, 136, 0.1);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.02),
        0 2px 8px -2px rgba(13, 148, 136, 0.06);
      padding: 18px;
    }

    /* === INFO CHIP/BADGE === */
    .chip-teal {
      background: linear-gradient(135deg, #ccfbf1, #d1fae5);
      border: 1px solid rgba(13, 148, 136, 0.15);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(13, 148, 136, 0.06);
    }
  </style>
