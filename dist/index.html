<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo Đề Thi Theo CV 7991</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0d9488', // Teal 600
            primaryDark: '#0f766e', // Teal 700
            secondary: '#475569', // Slate 600
            accent: '#2dd4bf', // Teal 400
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tQ/iRPQh0tBMr5y6CPiI17U/d2ydNaxp9EzjvA7f2cZxXfTd3S0W" crossorigin="anonymous">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* === TEAL GRADIENT BACKGROUND === */
    .bg-app-gradient {
      background: linear-gradient(135deg, #e6f7f5 0%, #f0fdfa 40%, #ecfdf5 70%, #f0fdfa 100%);
      position: relative;
    }

    .bg-app-gradient::before {
      content: '';
      position: fixed;
      top: -50%;
      right: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* === ELEVATED CARDS (Nổi khối 3D) === */
    .card-elevated {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 3px solid rgba(13, 148, 136, 0.18);
      box-shadow:
        0 1px 2px rgba(13, 148, 136, 0.06),
        0 4px 8px -1px rgba(13, 148, 136, 0.1),
        0 12px 28px -4px rgba(13, 148, 136, 0.14),
        0 24px 56px -10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-elevated:hover {
      transform: translateY(-3px) scale(1.003);
      border-bottom-color: rgba(13, 148, 136, 0.25);
      box-shadow:
        0 2px 4px rgba(13, 148, 136, 0.08),
        0 8px 16px -2px rgba(13, 148, 136, 0.14),
        0 20px 40px -6px rgba(13, 148, 136, 0.18),
        0 36px 72px -16px rgba(0, 0, 0, 0.12);
    }

    /* === GLASSMORPHISM HEADER === */
    .glass-header {
      background: linear-gradient(135deg, rgba(230, 247, 245, 0.97), rgba(204, 251, 241, 0.90), rgba(167, 243, 208, 0.8));
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-bottom: 2px solid rgba(13, 148, 136, 0.15);
      box-shadow:
        0 4px 16px -2px rgba(13, 148, 136, 0.12),
        0 8px 30px -4px rgba(0, 0, 0, 0.06);
    }

    /* === FLOATING STEP BAR === */
    .step-bar-floating {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      margin: 12px 24px;
      box-shadow:
        0 2px 6px rgba(13, 148, 136, 0.06),
        0 6px 16px -2px rgba(13, 148, 136, 0.1),
        0 14px 32px -6px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(13, 148, 136, 0.1);
      border-bottom: 2px solid rgba(13, 148, 136, 0.12);
      padding: 16px 28px;
    }

    /* Active step glow */
    .step-active-glow {
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2), 0 2px 8px rgba(13, 148, 136, 0.3);
    }

    /* === GRADIENT BUTTONS === */
    .btn-gradient-primary {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 4px 14px -3px rgba(13, 148, 136, 0.5);
      transition: all 0.25s ease;
    }

    .btn-gradient-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px -3px rgba(13, 148, 136, 0.6);
      background: linear-gradient(135deg, #0f9d91 0%, #0d9488 100%);
    }

    /* === ENHANCED MODAL === */
    .modal-elevated {
      background: white;
      border-radius: 20px;
      box-shadow:
        0 20px 60px -12px rgba(0, 0, 0, 0.2),
        0 40px 80px -20px rgba(13, 148, 136, 0.15);
      border: 1px solid rgba(13, 148, 136, 0.1);
    }

    /* === UPLOAD AREA === */
    .upload-zone {
      border: 2px dashed rgba(13, 148, 136, 0.3);
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.5), rgba(204, 251, 241, 0.3));
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .upload-zone:hover {
      border-color: rgba(13, 148, 136, 0.5);
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.8), rgba(204, 251, 241, 0.5));
      transform: translateY(-1px);
    }

    /* === INPUT FIELDS === */
    .input-elevated {
      border: 1px solid rgba(13, 148, 136, 0.15);
      border-radius: 10px;
      box-shadow: 0 2px 6px -2px rgba(13, 148, 136, 0.06);
      transition: all 0.25s ease;
      background: white;
    }

    .input-elevated:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1), 0 2px 8px -2px rgba(13, 148, 136, 0.12);
    }

    /* === SECTION BADGE (Number circles) === */
    .badge-section {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 3px 10px -2px rgba(13, 148, 136, 0.5);
    }

    /* === SHORTCUT BOX === */
    .shortcut-box {
      background: linear-gradient(135deg, rgba(219, 234, 254, 0.6), rgba(191, 219, 254, 0.4));
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 16px;
      box-shadow: 0 4px 16px -4px rgba(59, 130, 246, 0.1);
    }

    /* === ANIMATIONS === */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* === PROGRESS BAR GRADIENT === */
    .progress-gradient {
      background: linear-gradient(90deg, #0d9488, #2dd4bf, #10b981);
      border-radius: 4px;
    }

    /* === TOPIC TREE === */
    .chapter-row {
      transition: all 0.2s ease;
    }

    .chapter-row:hover {
      background: rgba(240, 253, 250, 0.6) !important;
    }

    /* === Custom scrollbar === */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(240, 253, 250, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #99f6e4, #5eead4);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #5eead4, #2dd4bf);
    }

    /* === EDITOR/PREVIEW PANELS === */
    .panel-elevated {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 3px solid rgba(13, 148, 136, 0.15);
      box-shadow:
        0 2px 6px rgba(13, 148, 136, 0.06),
        0 8px 20px -4px rgba(13, 148, 136, 0.1),
        0 16px 40px -8px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    /* === QUESTION CONFIG TABLE === */
    .config-table {
      background: linear-gradient(135deg, rgba(240, 253, 250, 0.6), rgba(204, 251, 241, 0.25));
      border-radius: 14px;
      border: 1px solid rgba(13, 148, 136, 0.12);
      border-bottom: 2px solid rgba(13, 148, 136, 0.1);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.02),
        0 2px 8px -2px rgba(13, 148, 136, 0.06);
      padding: 18px;
    }

    /* === INFO CHIP/BADGE === */
    .chip-teal {
      background: linear-gradient(135deg, #ccfbf1, #d1fae5);
      border: 1px solid rgba(13, 148, 136, 0.15);
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(13, 148, 136, 0.06);
    }

    /* === MARKDOWN CONTENT (Fix #4: replaces Tailwind prose) === */
    .markdown-content {
      max-width: none;
      line-height: 1.75;
      color: #334155;
    }
    .markdown-content h1, .markdown-content h2, .markdown-content h3,
    .markdown-content h4, .markdown-content h5, .markdown-content h6 {
      color: #1e293b;
      font-weight: 700;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }
    .markdown-content h1 { font-size: 1.875rem; }
    .markdown-content h2 { font-size: 1.5rem; }
    .markdown-content h3 { font-size: 1.25rem; }
    .markdown-content h4 { font-size: 1.125rem; }
    .markdown-content p {
      margin-bottom: 1em;
      line-height: 1.75;
    }
    .markdown-content strong { color: #0f172a; font-weight: 700; }
    .markdown-content ul, .markdown-content ol {
      padding-left: 1.5em;
      margin-bottom: 1em;
    }
    .markdown-content li {
      margin-bottom: 0.35em;
      color: #334155;
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 0.9em;
    }
    .markdown-content th {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      background: #f1f5f9;
      font-weight: 600;
      text-align: left;
      color: #1e293b;
    }
    .markdown-content td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
    }
    .markdown-content blockquote {
      border-left: 4px solid #0d9488;
      padding: 0.5em 1em;
      margin: 1em 0;
      background: #f0fdfa;
      color: #475569;
    }
    .markdown-content hr {
      border: none;
      border-top: 2px solid #e2e8f0;
      margin: 1.5em 0;
    }
    .markdown-content img {
      max-width: 100%;
      border-radius: 8px;
    }
    /* Ordered list numbering */
    .markdown-content ol {
      list-style-type: decimal;
    }
    .markdown-content ol ol {
      list-style-type: lower-alpha;
    }
    .markdown-content ul {
      list-style-type: disc;
    }
    /* KaTeX display math */
    .markdown-content .katex-display {
      margin: 0.75em 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }
    .markdown-content .katex {
      font-size: 1.1em;
    }
    /* Better question separation */
    .markdown-content > p > strong:first-child {
      display: inline-block;
      margin-top: 0.5em;
      color: #0f766e;
    }

    /* === RESPONSIVE MODE SELECTOR (Fix #6) === */
    @media (max-width: 640px) {
      .mode-desc-badge {
        display: none !important;
      }
    }

    /* === HOME LANDING — 3 MODE CARDS === */
    .mode-card {
      position: relative;
      border-radius: 24px;
      padding: 36px 28px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
    }
    .mode-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: 24px;
    }
    .mode-card:hover {
      transform: translateY(-8px) scale(1.02);
    }
    .mode-card:hover::before {
      opacity: 1;
    }
    .mode-card:active {
      transform: translateY(-2px) scale(0.99);
    }

    /* Card 1: Teal — CV 7991 */
    .mode-card-teal {
      background: linear-gradient(145deg, #f0fdfa 0%, #ccfbf1 40%, #99f6e4 100%);
      border-color: rgba(13, 148, 136, 0.25);
      box-shadow:
        0 4px 16px -4px rgba(13, 148, 136, 0.15),
        0 12px 32px -8px rgba(13, 148, 136, 0.1);
    }
    .mode-card-teal:hover {
      border-color: rgba(13, 148, 136, 0.5);
      box-shadow:
        0 8px 32px -4px rgba(13, 148, 136, 0.3),
        0 20px 48px -12px rgba(13, 148, 136, 0.2),
        0 0 0 1px rgba(13, 148, 136, 0.1);
    }
    .mode-card-teal::before {
      background: linear-gradient(145deg, rgba(13, 148, 136, 0.04), rgba(45, 212, 191, 0.08));
    }
    .mode-card-teal .mode-card-icon {
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
      box-shadow: 0 6px 20px -4px rgba(13, 148, 136, 0.5);
    }
    .mode-card-teal .mode-card-btn {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      box-shadow: 0 4px 16px -3px rgba(13, 148, 136, 0.5);
    }
    .mode-card-teal .mode-card-btn:hover {
      box-shadow: 0 6px 24px -3px rgba(13, 148, 136, 0.6);
    }

    /* Card 2: Blue — Tạo đề tương tự */
    .mode-card-blue {
      background: linear-gradient(145deg, #eff6ff 0%, #dbeafe 40%, #bfdbfe 100%);
      border-color: rgba(59, 130, 246, 0.25);
      box-shadow:
        0 4px 16px -4px rgba(59, 130, 246, 0.15),
        0 12px 32px -8px rgba(59, 130, 246, 0.1);
    }
    .mode-card-blue:hover {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow:
        0 8px 32px -4px rgba(59, 130, 246, 0.3),
        0 20px 48px -12px rgba(59, 130, 246, 0.2),
        0 0 0 1px rgba(59, 130, 246, 0.1);
    }
    .mode-card-blue::before {
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.04), rgba(96, 165, 250, 0.08));
    }
    .mode-card-blue .mode-card-icon {
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      box-shadow: 0 6px 20px -4px rgba(59, 130, 246, 0.5);
    }
    .mode-card-blue .mode-card-btn {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 0 4px 16px -3px rgba(59, 130, 246, 0.5);
    }
    .mode-card-blue .mode-card-btn:hover {
      box-shadow: 0 6px 24px -3px rgba(59, 130, 246, 0.6);
    }

    /* Card 3: Purple — Sinh 3 đề biến thể */
    .mode-card-purple {
      background: linear-gradient(145deg, #faf5ff 0%, #ede9fe 40%, #ddd6fe 100%);
      border-color: rgba(139, 92, 246, 0.25);
      box-shadow:
        0 4px 16px -4px rgba(139, 92, 246, 0.15),
        0 12px 32px -8px rgba(139, 92, 246, 0.1);
    }
    .mode-card-purple:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow:
        0 8px 32px -4px rgba(139, 92, 246, 0.3),
        0 20px 48px -12px rgba(139, 92, 246, 0.2),
        0 0 0 1px rgba(139, 92, 246, 0.1);
    }
    .mode-card-purple::before {
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.04), rgba(167, 139, 250, 0.08));
    }
    .mode-card-purple .mode-card-icon {
      background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
      box-shadow: 0 6px 20px -4px rgba(139, 92, 246, 0.5);
    }
    .mode-card-purple .mode-card-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      box-shadow: 0 4px 16px -3px rgba(139, 92, 246, 0.5);
    }
    .mode-card-purple .mode-card-btn:hover {
      box-shadow: 0 6px 24px -3px rgba(139, 92, 246, 0.6);
    }

    .mode-card-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 20px;
    }
    .mode-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 14px;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .mode-card-btn:hover {
      transform: translateY(-1px);
    }

    .mode-card-feature {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.85rem;
      color: #475569;
    }
    .mode-card-feature .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Floating particles animation */
    @keyframes float-particle {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
    }
    .mode-card .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float-particle 4s ease-in-out infinite;
    }
    .mode-card:hover .particle {
      opacity: 0.4;
    }

    /* Staggered animation for cards */
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-stagger-1 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards; opacity: 0; }
    .card-stagger-2 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards; opacity: 0; }
    .card-stagger-3 { animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards; opacity: 0; }

    /* Back to home breadcrumb */
    .back-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
      background: rgba(241, 245, 249, 0.8);
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .back-home-btn:hover {
      background: #f8fafc;
      color: #0d9488;
      border-color: #99f6e4;
    }
  </style>

</script>
